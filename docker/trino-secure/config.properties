coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# HTTPS with a self-signed certificate (generated by docker/setup.sh).
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/tls/server.pem

# Password file (for Basic auth) and OAuth2 via Keycloak, the latter both
# for the browser redirect flow ("External Auth") and for bearer tokens the
# driver obtains itself (client credentials, device flow).
http-server.authentication.type=PASSWORD,OAUTH2
# Like a real deployment, authentication only works over HTTPS (8443); the
# plain HTTP port (8081) rejects client requests.
internal-communication.shared-secret=${ENV:TRINO_INTERNAL_SHARED_SECRET}

# The browser reaches Keycloak at localhost:8180, Trino reaches it inside
# the compose network at keycloak:8080. Tokens carry the public issuer.
http-server.authentication.oauth2.issuer=http://localhost:8180/realms/trino
http-server.authentication.oauth2.oidc.discovery=false
http-server.authentication.oauth2.auth-url=http://localhost:8180/realms/trino/protocol/openid-connect/auth
http-server.authentication.oauth2.token-url=http://keycloak:8080/realms/trino/protocol/openid-connect/token
http-server.authentication.oauth2.jwks-url=http://keycloak:8080/realms/trino/protocol/openid-connect/certs
http-server.authentication.oauth2.client-id=trino
http-server.authentication.oauth2.client-secret=${ENV:TRINO_OAUTH2_CLIENT_SECRET}
http-server.authentication.oauth2.scopes=openid
http-server.authentication.oauth2.principal-field=preferred_username
