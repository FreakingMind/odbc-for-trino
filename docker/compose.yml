# Local Trino test environment for the ODBC driver.
#
#   docker/setup.sh                        # once: TLS cert + password file
#   docker compose -f docker/compose.yml up -d
#
# Services:
#   trino-noauth  http://localhost:8080   no authentication
#   trino-secure  http://localhost:8081   PASSWORD (alice) + OAUTH2 (Keycloak)
#                 https://localhost:8443  same, TLS with a self-signed cert
#   keycloak      http://localhost:8180   realm "trino" (admin console: /admin)
#
# All credentials are dummies from test.env.

name: trino-odbc-test

services:
  trino-noauth:
    image: trinodb/trino:${TRINO_VERSION:-484}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 5s
      timeout: 3s
      retries: 60

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.8.2}
    command: ["start-dev", "--import-realm"]
    env_file: test.env
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Tokens always carry the public issuer (what the browser and the driver
      # see); Trino calls the token/JWKS endpoints inside the network.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-trino.json:/opt/keycloak/data/import/realm-trino.json:ro
    ports:
      - "127.0.0.1:8180:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      retries: 60

  trino-secure:
    image: trinodb/trino:${TRINO_VERSION:-484}
    env_file: test.env
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - ./trino-secure/config.properties:/etc/trino/config.properties:ro
      - ./trino-secure/password-authenticator.properties:/etc/trino/password-authenticator.properties:ro
      - ./.generated/password.db:/etc/trino/password.db:ro
      - ./.generated/server.pem:/etc/trino/tls/server.pem:ro
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:8443:8443"
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 5s
      timeout: 3s
      retries: 60
