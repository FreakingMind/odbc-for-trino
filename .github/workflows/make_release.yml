name: Make a Release

on:
  push:
    tags:
      # We want to create releases whenever semver tags
      # are pushed
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    env:
      WIX_VERSION: "5.0.2"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get CMake
        uses: lukka/get-cmake@latest

      - name: Run vcpkg
        uses: lukka/run-vcpkg@v11
        
      - name: Run CMake and build x86
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x86
          cmake --preset x86-release
          cmake --build --preset x86-release

      - name: Run CMake and build x64
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake --preset x64-release
          cmake --build --preset x64-release

      - name: Add dotnet tool cli
        uses: actions/setup-dotnet@v5

      - name: Add WiX dotnet package
        run: |
          dotnet tool install --global wix --version ${{ env.WIX_VERSION }}

      - name: Add WiX UI extension
        run: |
         wix extension add -g WixToolset.UI.wixext/${{ env.WIX_VERSION }}

      - name: Build x86 installer
        shell: pwsh
        run: |
          .\install\build_x86_installer.ps1

      - name: Build x64 installer
        shell: pwsh
        run: |
          .\install\build_x64_installer.ps1

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: installers
          if-no-files-found: error
          overwrite: true
          path: |
            install/TrinoODBC_x86.msi
            install/TrinoODBC_x64.msi
            install/LICENSE.rtf
            install/third_party_licenses.txt


  macos:
    runs-on: macos-15
    env:
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/../vcpkg-cache

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install build tools
        run: brew install ninja autoconf automake libtool pkgconf

      - name: Set up vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "${VCPKG_ROOT}"
          "${VCPKG_ROOT}/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "${VCPKG_DEFAULT_BINARY_CACHE}"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-universal-osx-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}
          restore-keys: vcpkg-universal-osx-

      - name: Build the universal driver
        run: |
          cmake --preset macos-universal
          cmake --build --preset macos-universal
          ctest --preset macos-universal-unit

      - name: Build the installer
        run: scripts/macos/build-pkg.sh --version "${GITHUB_REF_NAME#v}"

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: macos-installer
          if-no-files-found: error
          path: out/pkg/*.pkg

  # The installers are built on Windows and macOS; the release is created
  # on Linux.
  release:
    runs-on: ubuntu-latest
    needs: [build, macos]

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: installers
          path: ./installers

      - name: Download the macOS installer
        uses: actions/download-artifact@v8
        with:
          name: macos-installer
          path: ./installers

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          prerelease: false
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            installers/TrinoODBC_x86.msi
            installers/TrinoODBC_x64.msi
            installers/TrinoODBC-*.pkg
            installers/LICENSE.rtf
            installers/third_party_licenses.txt
